name: Refresh profile cards

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it is not queued with everyone else's jobs.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_cards.py
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require a token that can see private contributions
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::METRICS_TOKEN is not set. The built-in GITHUB_TOKEN cannot read"
            echo "::error::private contributions, so the totals would silently drop."
            echo "::error::Create a classic PAT with the read:user scope and add it as the"
            echo "::error::METRICS_TOKEN repository secret."
            exit 1
          fi

      - name: Rebuild cards
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signal.svg assets/calibration.svg
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Refresh profile cards [skip ci]"
            git push
          fi
