name: Refresh profile cards

# Reads the public contribution endpoint, so this workflow needs no secret
# and no personal access token. The only permission it uses is write access
# to this repository, to commit the regenerated SVGs.

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it is not queued with everyone else's jobs.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet Pillow

      - name: Rebuild cards
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Refresh profile cards [skip ci]"
            git push
          fi
