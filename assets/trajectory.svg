<text x="138" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Designed and iterated prompts for generative models across several industries, running structured evaluation to make outputs reliable enough to</text>
<text x="138" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">ship.</text>
