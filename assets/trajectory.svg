<text x="138" y="139" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.4" fill="#7E93B2">SESAME SYNCHROTRON · JUN 2021 TO JUL 2022</text>
<text x="138" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Analysed RF cavities and wrote MATLAB and Python to simulate and tune system performance. Learned to trust the instrument over the intuition.</text>
</g>
