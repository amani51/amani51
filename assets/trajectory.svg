<text x="138" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF6">RF Engineer</text>
<text x="138" y="111" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.8" fill="#7E93B2">SESAME SYNCHROTRON  <tspan fill="#5F779A">·</tspan>  JUN 2021 &#8594; JUL 2022</text>
<text x="138" y="133" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Analysed RF cavities and wrote MATLAB and Python simulations to optimise</text>
<text x="138" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">system performance. Learned to trust instruments over intuition.</text>
</g>
<g class="e" style="animation-delay:0.10s">
<circle cx="92" cy="188" r="15" fill="#0B2044" stroke="#3EB54A" stroke-width="2"/>
<text x="92" y="192" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#3EB54A">02</text>
<text x="138" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF6">Teaching Assistant, Coding Program</text>
<text x="138" y="203" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.8" fill="#7E93B2">ASAC  <tspan fill="#5F779A">·</tspan>  MAR 2023 &#8594; MAR 2024</text>
<text x="138" y="225" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Mentored bootcamp developers, shaped curriculum, and assessed progress</text>
<text x="138" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">through technical interviews. Teaching is how you find out what you know.</text>
