<text x="138" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF6">AI Prompt Engineer</text>
<text x="138" y="295" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.8" fill="#7E93B2">MENADEVS  <tspan fill="#5F779A">·</tspan>  MAR 2024 &#8594; DEC 2024</text>
<text x="138" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Designed and iterated prompts for generative models across several</text>
<text x="138" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">industries, running structured evaluations to make outputs reliable.</text>
</g>
