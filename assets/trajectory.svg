<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Trajectory. 01, RF Engineer at SESAME Synchrotron, Jun 2021 to Jul 2022; 02, Teaching Assistant, Coding Program at ASAC, Mar 2023 to Mar 2024; 03, AI Prompt Engineer at MENADEVS, Mar 2024 to Dec 2024; 04, BTEC IT Internal Verifier at ISO Education Schools, Jan 2025 to Present. Education: ASAC / Code Fellows, Full Stack Web Development, 900-hour intensive, 2022 to 2023; University of Jordan, BSc Electrical Engineering, 2014 to 2019">
<title>Trajectory</title>
