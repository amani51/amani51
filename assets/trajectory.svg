<text x="92" y="376" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#3EB54A">04</text>
<text x="138" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF6">BTEC IT Internal Verifier</text>
<text x="138" y="387" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="1.8" fill="#7E93B2">ISO EDUCATION SCHOOLS  <tspan fill="#5F779A">·</tspan>  JAN 2025 &#8594; PRESENT</text>
<text x="138" y="409" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Verify assessment against BTEC and Pearson standards and hold grading</text>
<text x="138" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">consistent. Quality assurance, applied to people instead of code.</text>
</g>
