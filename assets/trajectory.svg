<text x="138" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Mentored bootcamp developers through their first production code, contributed to curriculum, and assessed progress through technical interviews.</text>
