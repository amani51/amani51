<text x="138" y="435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93A8C6">Verify assessment against BTEC and Pearson standards and hold grading consistent. Held alongside the engineering work at SkillsBIT.</text>
