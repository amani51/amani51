 </style>
<text class="l" style="animation-delay:0.00s" x="600" y="34" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="19" font-weight="500" letter-spacing="0.4" fill="#2BA8E0">Electrical engineer turned full-stack developer</text>
<text class="l" style="animation-delay:3.60s" x="600" y="34" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="19" font-weight="500" letter-spacing="0.4" fill="#2BA8E0">I build production systems, not demos</text>
<text class="l" style="animation-delay:7.20s" x="600" y="34" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="19" font-weight="500" letter-spacing="0.4" fill="#2BA8E0">Django  ·  ASP.NET Core  ·  React  ·  PostgreSQL</text>
<text class="l" style="animation-delay:10.80s" x="600" y="34" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="19" font-weight="500" letter-spacing="0.4" fill="#2BA8E0">Measure, don't guess.</text>
