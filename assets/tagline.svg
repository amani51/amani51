<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="Electrical engineer turned full-stack developer / I build production systems, not demos / Django  ·  ASP.NET Core  ·  React  ·  PostgreSQL / Measure, don't guess.">
<title>Tagline</title>
<style>
  .l{opacity:0;animation:cycle 14.4s ease-in-out infinite}
