<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Amani M AL-Zoubi, Full-Stack Engineer at SkillsBIT">
  <title>Amani M AL-Zoubi, Full-Stack Engineer at SkillsBIT</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071630"/>
      <stop offset="55%" stop-color="#0B1F42"/>
      <stop offset="100%" stop-color="#102C56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E96D9"/>
      <stop offset="100%" stop-color="#3EB54A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2BA8E0"/>
      <stop offset="100%" stop-color="#3EB54A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3EB54A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3EB54A" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" fill="url(#bg)"/>
  <rect width="1200" height="230" fill="url(#fade)"/>

  <!-- ascending arc: echoes the SkillsBIT arrow -->
  <path d="M 812 182 C 900 178 968 150 1014 106 C 1044 78 1068 56 1092 44"
        fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
  <path d="M 1096 42 L 1064 46 L 1082 72 Z" fill="#3EB54A"/>
  <text x="1052" y="30" font-family="SFMono-Regular, Consolas, Menlo, monospace"
        font-size="15" letter-spacing="3" fill="#3EB54A" opacity="0.85">0101</text>

  <!-- accent rule -->
  <rect x="62" y="66" width="5" height="98" rx="2.5" fill="url(#bar)"/>

  <text x="92" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="47" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">AMANI M AL-ZOUBI</text>

  <text x="94" y="146" font-family="SFMono-Regular, Consolas, Menlo, monospace"
        font-size="15.5" letter-spacing="4.2" fill="#8FA3BF">FULL-STACK ENGINEER</text>
  <text x="405" y="146" font-family="SFMono-Regular, Consolas, Menlo, monospace"
        font-size="15.5" letter-spacing="4.2" fill="#2BA8E0">// SKILLSBIT</text>

  <rect x="0" y="226" width="1200" height="4" fill="url(#accent)"/>
</svg>
