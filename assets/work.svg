<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 542" width="1200" height="542" role="img" aria-label="Selected systems. SkillsBIT platform: The live company site and the API behind it: service catalogue, enquiries, academy courses and enrolments, client project portal, support ticketing and role-based dashboards.; Dental clinic system: Front end and API. Public catalogue, online booking, patient portal and staff administration, with an interactive 3D tooth model mapped to FDI notation and a treatment cost calculator.; ERP and HR backend: Employee records, organisation structure and a ledger-backed leave engine on a multi-tenant data model scoped per company, with an append-only audit log.; PlugSpot: Personal project. An EV charging reservation API with geolocated stations, per-port scheduling and phone-number authentication localised for Jordan.; ISOEnroll and ISOExam: Personal projects built alongside my assessment work: admissions tracking with student registration and events, plus a separate examination platform.; And more in build: Further systems are in progress across the SkillsBIT product line and in my own repositories. Most of the code is private, so I am glad to walk through architecture on a call.">
