<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" width="1200" height="468" role="img" aria-label="Platforms built at SkillsBIT: Dental clinic, Public catalog, online booking, patient portal and staff admin, with a 3D treatment calculator.; ERP and HR, Attendance, leave, employee profiles, documents and contracts on a multi-tenant data model.; Restaurant, Menu, orders and day-to-day operations management for food service.; EV charging, Charging network platform covering accounts, sites and charging sessions.; Education, Student enrolment and registration, events and a separate examination platform.; Platform API, The core SkillsBIT services API that sits behind the whole product line.">
